[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaotalk-ax"
version = "0.9.0"
description = "KakaoTalk reading, navigation and sending via CLI and MCP: macOS Accessibility, experimental Windows Win32"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
dev = ["PyYAML>=6,<7"]
windows = ["uiautomation>=2.0.20; sys_platform == 'win32'"]

[project.scripts]
kax = "kakaotalk_automation:main"

[tool.setuptools]
py-modules = ["kakaotalk_mcp", "kakaotalk_automation", "kakaotalk_ax", "kakaotalk_state", "kakaotalk_lock", "kakaotalk_windows"]
packages = ["kakaotalk_native"]

[tool.setuptools.package-data]
kakaotalk_native = ["*.swift"]

[tool.setuptools.package-dir]
"" = "src"
